name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 阶段一：快速质量门禁 (PR 和 push 均运行)
  # 目标：3-5 分钟提供核心反馈
  #./gradlew ktlintFormat
  #./gradlew detekt ktlintCheck lintDevDebug testDevDebugUnitTest assembleDevDebug --parallel --stacktrace
  # ============================================================
  quick-check:
    name: Quick Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # PR 中只读缓存，避免污染主分支缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 静态分析 + Lint + 单测 + 编译，合并为一次 Gradle 调用
      - name: Static analysis, lint, unit tests & assemble
        run: >
          ./gradlew detekt ktlintCheck lintDevDebug
          testDevDebugUnitTest assembleDevDebug
          --parallel --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-check-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/detekt/**
            **/build/reports/ktlint/**
            **/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore