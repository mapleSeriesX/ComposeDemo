name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# 同一分支的并发运行会自动取消，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 JDK 17 (Compose 与 AGP 8.x 要求)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 设置 Gradle 并自动处理缓存 (关键性能步骤)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 在 PR 中只读缓存，防止 PR 污染主分支的缓存
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 4. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 运行静态代码分析 (可选，但推荐)
      # 如果你使用了 Detekt 或 Ktlint
      # - name: Run Detekt
      #   run: ./gradlew detekt
      # - name: Run Ktlint
      #   run: ./gradlew ktlintCheck

      # 6. 运行单元测试 (质量门禁)
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # 7. 构建 Debug APK (验证编译)
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 8. 上传构建产物 (APK)，方便下载测试
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always() # 即使前面步骤失败，也尝试上传（如有产出）
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 9. 上传测试报告 (失败时尤其有用)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            **/build/test-results/
            **/build/reports/
