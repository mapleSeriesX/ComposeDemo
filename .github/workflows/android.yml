name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Spotless Code Format Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Detekt Static Code Analysis
        run: ./gradlew detekt --stacktrace

      - name: Run Unit Tests & Jacoco Coverage
        run: ./gradlew testDevDebugUnitTest --stacktrace

      - name: Build Multi-Flavor Debug APKs
        run: ./gradlew :app:assembleDevDebug --stacktrace
